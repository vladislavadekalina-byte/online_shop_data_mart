version: 2

models:
  - name: fct_orders
    description: >
      Факт заказов: одна строка — один заказ. Тестовые заказы исключены.
      К заказу пристыкованы итоги по платежам; подтверждённая покупка — статус paid
      и хотя бы одна успешная оплата (возврат оплатой не считается).
    columns:
      - name: order_id
        description: "Номер заказа."
        data_tests: [unique, not_null]
      - name: customer_id
        description: "Клиент, оформивший заказ."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
        description: "Дата заказа."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_dates')
                field: date_day
      - name: ordered_at
        description: "Время оформления заказа."
      - name: order_status
        description: "Статус заказа: paid, pending, returned, cancelled."
        data_tests:
          - accepted_values:
              arguments:
                values: ['paid', 'pending', 'returned', 'cancelled']
      - name: order_amount
        description: "Сумма заказа в рублях после скидок."
        data_tests: [non_negative]
      - name: paid_amount
        description: "Сумма успешных оплат без возвратов; 0, если оплат нет."
        data_tests: [non_negative]
      - name: refunded_amount
        description: "Сумма возвратов положительным числом; 0, если возвратов нет."
        data_tests: [non_negative]
      - name: net_paid_amount
        description: "Оплачено минус возвращено."
      - name: successful_payments_count
        description: "Число успешных оплат без возвратов."
        data_tests: [non_negative]
      - name: first_paid_at
        description: "Время первой успешной оплаты; пусто, если оплат нет."
      - name: is_confirmed
        description: '{{ doc("confirmed_order") }}'
        data_tests: [not_null]
      - name: items_count
        description: "Количество различных товаров в заказе"
        data_tests: [non_negative]
  - name: fct_order_items
    description: >
      Позиции заказа: одна строка - один товар в заказе. 
      Позиции тестовых заказов исключены. Для каждой позиции указаны количество товара, 
      цена, скидка и итоговая стоимость. Также добавлены данные о клиенте, дате заказа 
      и признак подтверждённой покупки. Новые товарные позиции загружаются инкрементально,
      изменения ранее загруженных позиций автоматически не обновляются.
    columns:
      - name: order_id
        description: "Номер заказа."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id
      - name: product_id
        description: "Номер товара."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id
      - name: customer_id
        description: "Номер покупателя."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
        description: "Дата заказа."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_dates')
                field: date_day
      - name: quantity
        description: "Количество идентичных позиций."
        data_tests: [non_negative]
      - name: unit_price
        description: "Стоимость единицы товара."
        data_tests: [non_negative]
      - name: discount_amount
        description: "Размер скидки на товар."
        data_tests: [non_negative]
      - name: line_amount
        description: "Итоговая стоимость позиции после скидки."
        data_tests: [non_negative]
      - name: is_confirmed
        description: '{{ doc("confirmed_order") }}'
      - name: order_item_id
        description: "Уникальный номер позиции заказа."
        data_tests: [unique, not_null]
  - name: dim_customers
    description: >
      Клиенты: одна строка — один клиент.
      Содержит информацию о регистрации и привлечении клиента
      и статистику подтверждённых покупок.
      Клиенты без покупок также включены.
    columns:
      - name: customer_id
        description: "Номер клиента"
        data_tests: [unique, not_null]
      - name: registered_at
        description: "Дата и время регистрации клиента."
      - name: registration_date
        description: "Дата регистрации клиента."
      - name: city
        description: "Город клиента."
      - name: acquisition_channel
        description: "Канал привлечения клиента."
      - name: first_confirmed_order_id
        description: "Номер первого подтверждённого заказа."
      - name: first_confirmed_at
        description: "Дата и время первого подтверждённого заказа."
      - name: confirmed_orders_count
        description: "Количество подтверждённых заказов клиента."
        data_tests: [non_negative]
      - name: confirmed_revenue
        description: "Общая сумма подтверждённых заказов клиента."
        data_tests: [non_negative]
      - name: is_buyer
        description: "Признак наличия подтверждённых покупок."
  - name: dim_products
    description: >
      Товары: одна строка — один товар.
      Содержит информацию о названии, бренде и иерархии
      категорий товара.
    columns:
      - name: product_id
        description: "Номер товара."
        data_tests: [unique, not_null]
      - name: product_name
        description: "Название товара."
      - name: brand
        description: "Бренд товара."
      - name: category_name
        description: "Название категории товара."
      - name: category_id
        description: "Номер категории товара."
      - name: parent_category_id
        description: "Номер родительской категории."
      - name: parent_category_name
        description: "Название родительской категории."
      - name: root_category_name
        description: "Название корневой категории."
  - name: dim_dates
    description: >
      Календарь: одна строка — один календарный день.
      Содержит все даты от первого до последнего заказа,
      включая дни без заказов, и календарные характеристики.
    columns:
      - name: date_day
        description: "Календарная дата."
        data_tests: [unique, not_null]
      - name: year
        description: "Год."
      - name: quarter
        description: "Номер квартала."
      - name: month
        description: "Номер месяца."
      - name: day_of_week
        description: "Номер дня недели от 1 до 7."
      - name: is_weekend
        description: "Признак выходного дня."

